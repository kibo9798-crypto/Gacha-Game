<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>포인트 뽑기 - POINT DRAW</title>
    <meta name="description" content="귀여운 8비트 레트로 게임 스타일의 행운의 포인트 뽑기 웹 앱! 50개 티켓의 실시간 뽑기 및 당첨 결과" />
    <meta property="og:title" content="포인트 뽑기 - POINT DRAW" />
    <meta property="og:description" content="귀여운 8비트 레트로 게임 스타일의 행운의 포인트 뽑기 웹 앱! 50개 티켓의 실시간 뽑기 및 당첨 결과" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- 8-Bit Pixel Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/neodunggeunmo/neodunggeunmo@main/neodunggeunmo.css" />
  </head>
  <body class="bg-[#E6F7F2] text-[#134E48] antialiased select-none">
    <div id="root"></div>

    <!-- 1. Vite Development Server Entry (for AI Studio development) -->
    <script type="module" src="/src/main.tsx"></script>

    <!-- 2. GitHub Pages Direct Deployment Fallback Loader -->
    <script type="module">
      const isGitHubPages = window.location.hostname.endsWith('github.io') || window.location.protocol === 'file:';
      if (isGitHubPages) {
        // Load compiled production stylesheet
        if (!document.querySelector('link[href*="index.css"]')) {
          const css = document.createElement('link');
          css.rel = 'stylesheet';
          css.href = './assets/index.css';
          document.head.appendChild(css);
        }

        // Dynamically load compiled production JS bundle
        const bundlePath = './assets/' + 'index.js';
        import(/* @vite-ignore */ bundlePath).catch((err) => {
          console.error('Failed to load GitHub Pages bundle:', err);
        });
      }
    </script>
  </body>
</html>
